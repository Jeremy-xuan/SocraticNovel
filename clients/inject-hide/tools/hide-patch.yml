# HIDE-INJECT 取证用的 --patch 覆盖层（**只加配置，不改任何 profile 文件**）。
# 与 classroom-ui 的 `m2-patch.yml` 同形，只把教室目录指到本轮自己的副本，
# 免得与别的轮次的副本互相踩。
#
# 为什么要它：引擎会在会话里写教室的 `runtime/`（session_log / diagrams / progress …），
# 那是真教室的**状态真源**，不拿它当试验场。副本生成（在仓库根执行）：
#      rsync -a classrooms/cs-os/ /tmp/hide-classroom-copy/
#
# 🔴 渲染环境要自己填：下面四条动画路径原先指向旧工作区里的 `poc_动画可写性/env`，
#    那个 venv 已随工作区清理删除，本仓库也不分发第三方渲染环境。
#    自建一个装了 ManimCE 的 venv，把前两条与 `gatePython` 改成它的绝对路径；
#    `gate` 在仓库内，改成仓库根的绝对路径即可。
- id: socratic-engine
  name: socratic-engine
  config:
    classroomDir: /tmp/hide-classroom-copy
    # 教室 `classroom.yaml` 声明了 `animation: enabled: true`，渲染器路径是**部署事实**、
    # 必须由 profile/patch 提供，否则引擎装载时就报错。路径抄自 `m2-patch.yml`（同一条实测过的组合）。
    animation:
      python: /path/to/manim-venv/bin/python
      manim: /path/to/manim-venv/bin/manim
      gate: /path/to/SocraticNovel-GitHub仓库/tools/animation-gate/animation_gate.py
      gatePython: /path/to/manim-venv/bin/python
      quality: l
