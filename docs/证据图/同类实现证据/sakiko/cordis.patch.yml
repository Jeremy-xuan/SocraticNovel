# sakiko-for-dsh —— profile 层补丁（安装即生效的关键）
#
# package.json 里通过
#     "dsh": { "bundle": { "patch": "./cordis.patch.yml" } }
# 声明本文件。于是 `dsh plugin --profile <profile> add sakiko-for-dsh` 之后，
# 本包会被记入该 profile 的 dsh.profile.bundles，每次 dsh 启动都自动加载，
# 用户不需要手工编辑 profile 的 cordis.patch.yml（也不需要跑任何 .bat/.ps1）。
#
# 若你的 profile 里已经手工写过同一行（id: sakiko，或改名前的 id: amadeus），
# 请把手工的那份删掉，否则同一个 id 会出现两次。
#
# ⚠️ 本文件是**版本控制里的唯一真源**（2026-09-13 复审 B1）：
#    它必须被 git 跟踪。旧版把它放在 build_dist.py 的 publish-files/ 里打包时才注入，
#    于是从 GitHub 源码装（`dsh plugin add github:hg4/sakiko-for-dsh`）拿到的那份
#    **没有 bundle 声明** ⇒ DSH 打 `declares no dsh.bundle` 警告 ⇒ 插件永不加载。
#    仓库外的本地打包脚本 build_dist.py（**不在本仓库内**）现在只**校验**
#    （校验仓库版 package.json 与 git 跟踪状态），不再注入。

- insert:
    - id: sakiko
      name: sakiko-for-dsh
