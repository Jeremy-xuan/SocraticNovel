<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>群聊模板 · SocraticNovel</title>
<!--
  ============================================================
  微信聊天界面模板（SocraticNovel 教室用）
  ------------------------------------------------------------
  用法：**课后只改下面 <script> 里的 DATA，不要动 CSS 与渲染代码。**

  1. 往 DATA.messages 末尾追加几条消息即可（新的一节课追加在最后）。
  2. 需要时间分隔就加一条 { "t": "今天 20:14" }。
  3. 需要系统提示（入群/撤回等）就加 { "sys": "..." }。
  4. 保存后直接用浏览器打开；不需要任何依赖、不联网。
  5. 头像用名字首字自动生成（无需图片文件）；如要真头像，
     在成员条目里给 "avatar": "图片路径或URL"。

  messages 里每条支持：
    { "t": "时间文字" }                  → 居中的时间分隔
    { "sys": "文字" }                    → 居中的灰色系统提示
    { "who": "凛", "text": "……" }        → 别人发的（左侧白气泡）
    { "who": "我", "out": true, "text": "……" } → 自己发的（右侧绿气泡）
    { "who": "凛", "text": "……", "quote": "被引用的那句" } → 带引用
    { "who": "凛", "img": "图片路径或URL", "caption": "说明" } → 图片消息
  ============================================================
-->
<style>
  :root{
    --page:#ededed;          /* 微信聊天页底色 */
    --bar:#ededed;           /* 顶栏底色 */
    --line:rgba(0,0,0,.08);  /* 发丝线 */
    --bubble-in:#ffffff;
    --bubble-out:#95ec69;
    --ink:#191919;
    --ink-2:#5b5b5b;
    --ink-3:#9a9a9a;
    --link:#576b95;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:#c8c8c8;
    color:var(--ink);
    font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* 手机框：桌面居中，手机满宽 */
  .phone{
    max-width:430px;margin:0 auto;min-height:100vh;
    background:var(--page);
    display:flex;flex-direction:column;
    box-shadow:0 0 0 1px var(--line);
  }
  /* 顶栏 */
  .bar{
    position:sticky;top:0;z-index:5;
    background:var(--bar);
    border-bottom:1px solid var(--line);
    padding:10px 14px 11px;
    display:flex;align-items:center;gap:10px;
    backdrop-filter:saturate(180%) blur(12px);
  }
  .bar .back{color:var(--ink);font-size:20px;line-height:1;width:18px;flex:none}
  .bar .title{flex:1;text-align:center;font-size:17px;letter-spacing:.01em}
  .bar .title small{display:block;font-size:11px;color:var(--ink-3);font-weight:400;margin-top:1px}
  .bar .more{width:18px;flex:none;color:var(--ink);font-size:18px;text-align:right;letter-spacing:1px}
  /* 消息区 */
  .thread{flex:1;padding:14px 12px 28px}
  .time{text-align:center;margin:14px 0 10px}
  .time span{
    font-size:12px;color:#fff;background:rgba(0,0,0,.16);
    padding:2px 8px;border-radius:4px;
  }
  .sys{text-align:center;margin:12px 0}
  .sys span{font-size:12px;color:var(--ink-3);background:rgba(0,0,0,.05);padding:3px 9px;border-radius:4px}
  .row{display:flex;gap:9px;margin:0 0 14px;align-items:flex-start}
  .row.out{flex-direction:row-reverse}
  .avatar{
    width:38px;height:38px;flex:none;border-radius:5px;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:15px;font-weight:400;letter-spacing:0;
    background-size:cover;background-position:center;
    user-select:none;
  }
  .col{max-width:calc(100% - 92px);min-width:0}
  .row.out .col{display:flex;flex-direction:column;align-items:flex-end}
  .name{font-size:12px;color:var(--ink-3);margin:0 0 4px 2px}
  .bubble{
    position:relative;
    background:var(--bubble-in);
    border-radius:6px;
    padding:9px 12px;
    font-size:16px;line-height:1.48;
    word-break:break-word;white-space:pre-wrap;
    box-shadow:0 0 0 1px rgba(0,0,0,.02);
  }
  .row.out .bubble{background:var(--bubble-out)}
  /* 气泡小尖角 */
  .bubble::before{
    content:"";position:absolute;top:12px;left:-5px;
    width:0;height:0;border:5px solid transparent;border-right-color:var(--bubble-in);border-left:0;
  }
  .row.out .bubble::before{
    left:auto;right:-5px;border-right-color:transparent;border-left-color:var(--bubble-out);border-right:0;
  }
  .bubble .q{
    border-left:2px solid rgba(0,0,0,.12);
    padding:2px 0 2px 8px;margin:0 0 6px;
    color:var(--ink-3);font-size:13px;
  }
  .bubble .img{
    display:block;max-width:220px;border-radius:4px;margin:0 0 4px;
    background:#f2f2f2;min-height:60px;
  }
  .bubble .cap{color:var(--ink-2);font-size:13px;margin-top:2px}
  .bubble .mono{font-family:var(--mono);font-size:15px}
  /* 页脚 */
  .foot{
    border-top:1px solid var(--line);
    background:var(--page);
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:9px;
    font-size:13px;color:var(--ink-3);
  }
  .foot .hint{flex:1}
  .foot .upd{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
  @media print{
    body{background:#fff}
    .phone{box-shadow:none;max-width:100%}
  }
</style>
</head>
<body>
<div class="phone" id="phone">
  <header class="bar">
    <div class="back">‹</div>
    <div class="title" id="title">群聊</div>
    <div class="more">⋯</div>
  </header>
  <main class="thread" id="thread"></main>
  <footer class="foot">
    <div class="hint">本文件由课后自动更新 · 只改 DATA，不要改样式</div>
    <div class="upd" id="upd"></div>
  </footer>
</div>

<script>
/* ============================================================
   ① 只改这里（DATA）。每上完一节课，往 messages 末尾追加。
   ============================================================ */
const DATA = {
  group: "电磁学答疑组",
  subtitle: "凛 · 律 · 朔",          // 群成员一行；不需要就留空字符串
  updated: "2026-09-22",             // 最后更新时间
  messages: [
    { t: "昨天 22:41" },
    { sys: "凛 邀请 你 加入了群聊" },
    { who: "凛", text: "课本第 23 章看完了吗？明天从高斯定律开始。" },
    { who: "我", out: true, text: "看了一半，卡在电通量那一段的直觉上。" },
    { who: "凛", text: "正常。先别急着算积分——你告诉我，一个电荷待在立方体正中央，穿出每一个面的通量一样吗？" },
    { who: "我", out: true, text: "一样……吧？对称。" },
    { who: "凛", text: "对，是对称。那如果它偏到某个角上呢？", quote: "一个电荷待在立方体正中央" },
    { t: "今天 20:14" },
    { who: "律", text: "她把上周的错题又翻出来了，你今天得把这道补完。" },
    { who: "我", out: true, text: "……行，我先把通量那步写清楚。" },
    { sys: "律 撤回了一条消息" }
  ]
};

/* ============================================================
   ② 以下是渲染代码，不要改
   ============================================================ */
(function () {
  const AVATAR_COLORS = ["#7a8c99","#8f9d7a","#9d8a7a","#7a8f9d","#96849c","#849c96","#9c8a84"];
  function hash(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }
  function initials(name){
    const t=(name||"?").trim();
    if(!t) return "?";
    // 中文取首字；西文取首字母
    return /[\u4e00-\u9fa5]/.test(t[0]) ? t[0] : t.slice(0,2).toUpperCase();
  }
  function avatarEl(name){
    const d=document.createElement("div");
    d.className="avatar";
    const c=AVATAR_COLORS[hash(name)%AVATAR_COLORS.length];
    d.style.background=c;
    d.textContent=initials(name);
    d.title=name||"";
    return d;
  }
  function bubbleEl(m){
    const b=document.createElement("div");
    b.className="bubble";
    if(m.quote){
      const q=document.createElement("div"); q.className="q"; q.textContent=m.quote; b.appendChild(q);
    }
    if(m.img){
      const im=document.createElement("img"); im.className="img"; im.src=m.img; im.alt=m.caption||"";
      im.onerror=function(){ this.style.display="none"; };
      b.appendChild(im);
    }
    if(m.text){
      const sp=document.createElement("span");
      if(m.mono) sp.className="mono";
      sp.textContent=m.text;
      b.appendChild(sp);
    }
    if(m.caption){
      const c=document.createElement("div"); c.className="cap"; c.textContent=m.caption; b.appendChild(c);
    }
    return b;
  }
  function render(){
    document.title = "群聊 · " + DATA.group;
    document.getElementById("title").innerHTML =
      escapeHtml(DATA.group) + (DATA.subtitle ? "<small>"+escapeHtml(DATA.subtitle)+"</small>" : "");
    document.getElementById("upd").textContent = DATA.updated || "";
    const thread=document.getElementById("thread");
    thread.innerHTML="";
    (DATA.messages||[]).forEach(function(m){
      if(m.t){
        const d=document.createElement("div"); d.className="time";
        d.innerHTML="<span>"+escapeHtml(m.t)+"</span>"; thread.appendChild(d); return;
      }
      if(m.sys){
        const d=document.createElement("div"); d.className="sys";
        d.innerHTML="<span>"+escapeHtml(m.sys)+"</span>"; thread.appendChild(d); return;
      }
      const row=document.createElement("div");
      row.className="row"+(m.out?" out":"");
      row.appendChild(avatarEl(m.who||(m.out?"我":"?")));
      const col=document.createElement("div"); col.className="col";
      if(!m.out){
        const n=document.createElement("div"); n.className="name"; n.textContent=m.who||"";
        col.appendChild(n);
      }
      col.appendChild(bubbleEl(m));
      row.appendChild(col);
      thread.appendChild(row);
    });
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  render();
})();
</script>
</body>
</html>
