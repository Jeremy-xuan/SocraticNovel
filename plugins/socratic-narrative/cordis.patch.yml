# socratic-narrative bundle patch：挂载叙事层（N1 独立上下文运行器 + N2 日记）。
#
# 🔴 这里**不放任何密钥**：模型通道走实例自己已配置的 provider（`ctx.llm` 的适配器，
#    其凭据在实例的 provider 配置 / 环境变量里），本插件只拿路由名。
#
# 模型路由的取值顺序（见 README §2）：
#   ① 调用参数 `model`（引擎读 `classroom.yaml` 的 `narrative.models.<task>` 后传进来）
#   ② 本文件的 `config.provider` / `config.model` / `config.models.<task>`
#   ③ 实例的 `ctx.agentDefaultModel.currentSelection()` —— 即「实例已配置的模型通道」
#   三者都取不到 → 抛 `ROUTE_MISSING`（大声失败，不猜、不回退到某个写死的模型）。
- insert:
    - id: socratic-narrative
      name: socratic-narrative
      # config 段留空是有意的：默认吃实例的 agentDefaultModel。
      # 要给日记/群聊分别指定模型时，在这里或 classroom.yaml 里写，例如：
      #   config:
      #     models:
      #       diary: { provider: deepseek-official, model: deepseek-v4-flash }
      #     timeoutMs: 60000
      config: {}
