  #   `predictTurnBlocks`，逐条复刻 once/turn/n_turns/phase/on_demand 的判定）
  #   → **动这里的频率语义＝两处必须同改**，否则验收仍按旧语义推期望块清单。
  # ⚠️ 讲次门**不加**在这四块上：它们是**跨讲常驻的纪律**，不随讲次变化
  #   （"每讲更新"指的是人更新内容，不是引擎按讲切换——内容更新由课后流程改文件）。

