  # curriculum.md（10727B，139 行）· 草案 §4.1 `curriculum.map`（B3 混合频率）
  # 口径：`frequency: {every: phase}` + `phase.phases: [open]` = **每讲开场注入一次**。
  #   理由：① frequency 是单值字段，"ondemand ＋ 条件强制"这种复合规则在本 schema 下
  #   不可表达；② 取"每讲必读"这一半，因为"按需"那一半靠 on_demand，而引擎骨架的
  #   on_demand = **永不注入**（injector.mjs: `inject = false // TODO: M3 工具接入`）
  #   → 标 on_demand 会让课程表在课上根本不出现；③ 代价：10727B 若每轮注入不可接受
  #   （草案 §4.5 冲突 5 的退路是 n_turns n=1，明确说"浪费"），故不用每轮。
  # 标「推断/待确认」：草案倾向"保留混合"，本条是它在校验器值域内的最近表达。
  # 🔴 M3-STATE（2026-09-24）改为**每讲一次**：`frequency: { every: once, anchor: lesson_start }`。
  #   语义＝**讲次（`current_lesson`）变化时重新注入一次**（同一讲内只注入一次）。
  #   为什么换掉 M2 的写法：M2 用的是 `frequency: {every: phase}` ＋ `phase: {phases: [open]}`
  #   ＋ `lesson: {current: true}`（无 `of`）。`{current:true}` 无 `of` ＝「只要有讲次在讲就放行」
  #   → **等于没加门**（只声明意图）；而相位恒为 open 时 `every: phase` **每回合都成立**
  #   → 实际是每回合注入 10,763 B，不是设计意图的"每讲一次"。
  #   🔴 同时**去掉了相位门 `phase: {phases: [open]}`**：本块是**讲次级**背景（本讲在整门课里的
  #   位置 ＋ 对应 OSTEP 链接），不是相位级材料。留着相位门会造出一个静默失效口子——
  #   若教师在新一讲开场时相位还停在上一讲的 `close`，本块就**整讲都不会注入且不报错**。
  #   去掉后语义干净：**每讲一次，无条件**。
  #   ⚠️ 为什么不带讲次门 `of`：本块**不隶属于某一讲**（14 讲共用同一张课程表），带 `of` 会让它
  #     只在某一讲注入。`anchor: lesson_start` 正好表达"每讲换一次"而无需 `of`。
  - id: curriculum.map
    path: curriculum.md
    layer: context
    position: { target: chat, depth: 4 }        # depth:4 = 草案 §4.1 的 d4 与 §3 示例一致
    frequency: { every: once, anchor: lesson_start }
    wrap: { style: system-reminder }
    render: { enabled: false }

