# ============================================================================
# cs-os 教室包 · 注入元数据（classroom.yaml）
# 格式权威：docs/架构/教室manifest格式_草案_v0.md（M1，2026-09-23）
# format 标识：socratic-classroom/0
# 产出：S4 数据/格式子代理，2026-09-23。本文件是**新增**产物，未改动任何既有 .md。
#
# ── 两条落地口径（写在文件头，避免后来者误读）─────────────────────────────
# ① 🔴 AGENTS.md 与 CLAUDE.md **不在本文件中声明为注入块**。
#    依据：宿主 agent-instructions 包已把 AGENTS.md 以 user/message 注入
#    （侦察_L1_拼装权.md §1.5：createUserMessage({source:{kind:'agent-instructions'}}，
#     index.ts:338-339；文件候选 DEFAULT_INSTRUCTION_FILE_CANDIDATES = ['AGENTS.md',
#     'CLAUDE.md']）→ 再声明一次 = 同一份内容进两次
#    （实测报告_双重注入与回合语义_2026-09-23）。CLAUDE.md 实测 419B，正文只有一句
#    "完整指令在 AGENTS.md"（别名文件）→ 同样交给宿主，manifest 不重复注入。
#
# ② 本文件只写 **lib/manifest.mjs 实际消费的字段**（v0 子集）＋ 草案 §2.0/§3 的顶层声明。
#    草案提到而校验器不支持的字段（position.after / position.section_name /
#    render.vars / render.missing / wrap.header / wrap.role /
#    frequency.every=session / layer 值 resident|startup / source /
#    name / purpose / notes / tags / source_sha256）**一律不写入本文件**，
#    逐条列在《对账表_cs-os_manifest_2026-09-23.md》的「待确认清单」。
#    ⚠️ M3-STATE 变更两条：① `frequency.anchor` **已支持**（`lesson_start` / `session_start`，
#       只与 `every: once` 连用）→ 从上面这张"不支持"清单里移出；
#       ② `phase.advance_on` **已裁定不做**（相位推进改由教师在课堂上用 `classroom_set_phase`
#       工具宣布）→ 写了会**报错**，不再是"静默忽略"。
#
# ③ 块与文件的粒度：
#    · **段级切片已支持**（M2-SCHEMA v0.2，2026-09-24，修 P1-1）：块可写
#      `section: <二级标题文本>`，引擎只注入该标题的正文（到下一个同级或更高级标题为止）。
#      → 草案 §4.1 的 `_anchor.md` 三拆（此处落成**四块**）现已可表达。
#    · **讲次门已支持**（同批，修 P0-4）：块可写 `lesson: {current:true, of:N}` /
#      `{current:true}`（无 of＝只要有讲次在讲即放行）/ `{list:[..]}` / `{range:[a,b]}`，
#      值取自 runtime_store 声明的 progress 文件里的
#      `current_lesson: <整数>`（🔴 语义＝**本轮要讲的讲次**，初始 1，课后更新改成下一讲）。
#      🔴 `of: N` ＝ **本块所属讲次**（本块只在讲次 N 注入）；**必须显式写**，
#      不靠块 id 或 path 猜（猜＝隐式耦合，会静默失效——正是 P0-4 的教训）。
#      → `story.node.NN` / `material.current.NN` 等按讲变化的块据此只在当讲注入。
#    · 仍未支持：`path` 的 `{NN}` 通配展开 → story/material 仍须**逐讲展开成字面量块**。
# ============================================================================

format: socratic-classroom/0

# ── 教室标识（校验器只强校验 id 为非空字符串；其余字段为草案 §2.0 声明，引擎不消费）──
classroom:
  id: cs-os
  title: 计算机系教室 · 操作系统
  subject: 操作系统
  lessons: 14                      # 依据：curriculum.md「讲数：14 讲」；story/ch01–ch14 实测 14 个文件
  classroom_version: 0.1.0
  license: CC-BY-NC-SA-4.0         # 依据：characters/deepseek.md「按项目契约（内容 CC BY-NC-SA）发布」

# ── runtime 目录（草案 §2.0 声明位）──────────────────────────────────────────
# 🔴 M2-SCHEMA v0.2 起 `runtime_store` **不只是声明位**：`lesson_key` 是讲次门的唯一取值来源。
#    引擎按行在 progress 文件里找 `<lesson_key>: <整数>`。
#    语义（写死）：`current_lesson` = **本轮要讲的讲次**（不是"已完成的讲次"）；初始 1。
#    找不到该行 / 值不是整数 → **引擎报错**（不静默失效）。
runtime_store:
  dir: runtime/
  progress: runtime/progress.md
  lesson_key: current_lesson

# ── 教学动画开关（ANIM-ENABLE，2026-09-24；消费方 = lib/manifest.mjs 的 normalizeAnimation）──
# 🔴 语义（写死，逐字见 lib/manifest.mjs:155-184）：**教室声明"我这一课要不要放教学动画"**，
#    引擎只实现机制。段**缺席** → manifest 里根本不挂 animation 键 → 引擎不注册
#    `classroom_animate` / `classroom_animation_status`、不注入动画纪律段、不产生就绪通报
#    → 老教室行为逐字不变。段在场且 enabled 不为 false → 工具与纪律段都挂上。
# 🔴 这里**只写最小集**（引擎只认 `enabled` 一个子键，写别的键会报错，见 ANIMATION_KEYS）：
#    渲染器路径（python / manim / quality / gate / gatePython）**不写在这里**——那是**部署事实**，
#    不是课程内容；由 profile 的 `socratic-engine` config.animation（或环境变量）提供。
#    → 本教室声明了 animation 而部署没配渲染环境时，**装载时就报错**（不留到课堂上才炸）。
# 🔴 为什么必须有一条配套的渠道纪律：ANIM-ORCH 实测——只挂工具、内容侧不提动画时，
#    模型两个点位上一次都没调 `classroom_animate`（全走 `classroom_draw`）。
#    渠道纪律写在 `_anchor.md`「本课不许违反项」（每轮贴尾注入）。
animation:
  enabled: true

# ── 备课清单（ANIM-PREP-ENABLE，2026-09-24；消费方 = lib/manifest.mjs 的 normalizePrep）──
# 🔴 语义（写死；形状与校验口径逐字见 lib/prep.mjs 的文件头）：
#    教室在这里**预先声明**「第几讲要放哪几段动画、用哪个模板、参数是多少」→ 引擎**开课前**
#    就能把参数拼成脚本、把脚本渲成片子（**零模型调用**）；课上老师按 `id`（＝工具入参 `prepId`）
#    **取用**，命中缓存**基本不用等**。没有这段声明，课上就只能现场套模板（要等一小会儿）
#    或自己写脚本（明显更慢）。
# 🔴 三条硬约束（写错**报错**，不静默）：
#    ① 每条的 `material` 必须是**相对本教室目录的真实文件**：它是**缓存键**的教材内容哈希来源
#       （教材改了 → 键变 → 自动重渲）。指错了不会报错、只会每次上课都重渲一遍——故引擎校验存在性；
#    ② `template` / `params` 用**与课堂上调 `classroom_animate_template` 完全同一个校验器**
#       （课前写声明与课上现生成不会各有一套判据）；
#    ③ 声明了本段却缺 `animation: {enabled: true}` → 报错（死配置：预热跑不了、工具也没注册）。
# 🔴 只放**本讲真会出现**的图元，不放占位：每条都要花一次渲染时间，占了不用就是白花。
# 🔴 与渠道纪律的关系：本清单是渠道②（"取备好的"）的唯一来源，纪律写在 `_anchor.md`「本课不许违反项」。
#    教材依据（逐条）：
#    · ctx-switch       ← materials/ch01.md §2「切换时为什么要保存状态」（2026-09-24 合入用户新版后该节改名，原为「片段一」）
#    · proc-lifecycle   ← materials/ch02.md §片段三「僵尸进程……父进程取走后，记录才被释放」
#    · fifo-vs-sjf      ← materials/ch03.md「关键关口」第 1 段（A 需 100、B/C 各需 10，0 时刻到达）
#    · avg-turnaround   ← 同上（平均周转 110 / 50；平均响应 70 / 10，都是那组数算出来的）
#    · race-interleaving← materials/ch09.md「线程 A 读到 0 → 线程 B 也读到 0 → A 写 1 → B 写 1」
prep:
  items:
    # ── 第 1 讲 · 一个程序怎么跑起来 ────────────────────────────────────────
    - id: ctx-switch
      lesson: 1
      template: timeline
      title: 两个进程轮流用 CPU（上下文切换）
      material: materials/ch01.md
      caption: 针对「切走时为什么要保存执行位置与寄存器」这一步
      params:
        unit: 时间单位
        note: 切走时保存执行位置与寄存器，切回来时恢复
        lanes:
          - label: 进程 A：执行 → 被切走 → 再执行
            segments:
              - { start: 0, end: 2, label: A 执行, color: blue, endLabel: "2" }
              - { start: 4, end: 6, label: A 执行, color: blue, endLabel: "6" }
          - label: 进程 B：在 A 被切走的间隙里跑
            segments:
              - { start: 2, end: 4, label: B 执行, color: amber, endLabel: "4" }
              - { start: 6, end: 8, label: B 执行, color: amber, endLabel: "8" }

    # ── 第 2 讲 · 进程的 API 与生命周期 ─────────────────────────────────────
    - id: proc-lifecycle
      lesson: 2
      template: state_machine
      title: 子进程退出之后为什么还留着（僵尸 → 回收）
      material: materials/ch02.md
      caption: 针对「僵尸进程不是 bug，是父进程还没来取件」这一步
      params:
        note: 父进程取走退出状态之前，内核保留一小份记录
        states:
          - { id: running, label: 运行 }
          - { id: zombie,  label: 僵尸 }
          - { id: reaped,  label: 已回收 }
        transitions:
          - { from: running, to: zombie, label: exit 退出 }
          - { from: zombie,  to: reaped, label: 父进程 wait }
        walk: [running, zombie, reaped]

    # ── 第 3 讲 · 调度 ──────────────────────────────────────────────────────
    - id: fifo-vs-sjf
      lesson: 3
      template: timeline
      title: 长任务怎么堵住短任务（FIFO vs SJF）
      material: materials/ch03.md
      caption: 针对「FIFO 会让长任务把后面全堵住」这一步
      params:
        note: 周转时间 = 完成时刻 − 到达时刻
        lanes:
          - label: 先到先服务（FIFO）：A → B → C
            segments:
              - { start: 0, end: 100, label: A, color: blue, endLabel: "100" }
              - { start: 100, end: 110, label: B, color: amber, endLabel: "110" }
          - label: 最短作业优先（SJF）：B → C → A
            segments:
              - { start: 0, end: 10, label: B, color: amber, endLabel: "10" }
              - { start: 10, end: 120, label: A, color: blue, endLabel: "120" }
    - id: avg-turnaround
      lesson: 3
      template: bar_compare
      title: 三种调度的平均周转时间
      material: materials/ch03.md
      required: false
      params:
        highlight: SJF
        items:
          - { label: FIFO, value: 96.7 }
          - { label: SJF, value: 50.0 }
    - id: process-states
      lesson: 5
      template: state_machine
      title: 一个进程的一生：三态怎么走
      material: materials/ch05.md
      params:
        states:
          - { id: ready, label: 就绪 }
          - { id: running, label: 运行 }
          - { id: blocked, label: 阻塞 }
        transitions:
          - { from: ready, to: running, label: 被调度 }
          - { from: running, to: blocked, label: 等 I/O }
          - { from: blocked, to: ready, label: I/O 完成 }
        walk: [ready, running, blocked, ready]

    # ── 第 9 讲 · 并发 ──────────────────────────────────────────────────────
    - id: race-interleaving
      lesson: 9
      template: timeline
      title: 两条线程交错读写同一块内存会读出什么
      material: materials/ch09.md
      caption: 针对「线程 A 读到 0 → 线程 B 也读到 0 → A 写 1 → B 写 1」这一步
      params:
        note: 没有同步时，交错顺序决定最终结果
        lanes:
          - label: 线程 A：读 x → 写 x=1
            segments:
              - { start: 0, end: 2, label: A 读 x=0, color: blue, endLabel: "0" }
              - { start: 2, end: 4, label: A 写 x=1, color: blue, endLabel: "1" }
          - label: 线程 B：读 x → 写 x=1
            segments:
              - { start: 1, end: 3, label: B 读 x=0, color: amber, endLabel: "0" }
              - { start: 3, end: 5, label: B 写 x=1, color: amber, endLabel: "1" }

# ── 教学相位枚举（草案 §2.0；顺序即推进顺序）──────────────────────────────
# ✅ P0-1 已修（2026-09-23）：相位值域由本声明驱动，引擎不再硬编码。
#    块里出现的相位 id 不在本列表内 → 引擎**报错**（不静默不注入）。
# ✅ M3-STATE 已修（2026-09-24）：**相位推进已落地，但不由引擎按规则推进**——
#    教师（模型）在课堂上判断"该进哪个相位了"，调 `classroom_set_phase` 工具宣布；
#    引擎只做两件事：① 记录（取值必须落在本列表内，否则报错并列出合法 id）；
#    ② 按新相位重新裁决所有带相位门的块（**下一回合**生效）。
#    🔴 `phase.advance_on` **已裁定不做**：写了会报错（不静默）。换相位的时机是**教学现场判断**，
#    不是脚本——什么时候进 probe / check / close 的判据写在 `system_core.md` 与 `AGENTS.md`。
#    📌 相位状态落盘在 `runtime/progress.md` 的机器可读行 `current_phase: <id>`
#    （草案 §2.0：`runtime_store` 是「模板变量与相位状态的来源」）；换会话会接上上次的相位。
phases:
  - { id: open,   name: 开场 }
  - { id: probe,  name: 追问 }
  - { id: answer, name: 学生作答 }
  - { id: check,  name: 对答案 }
  - { id: review, name: 复习 }
  - { id: close,  name: 收尾 }

blocks:

  # ══════════════════════════════════════════════════════════════════════════
  # A · 系统段（target: system）—— 4 块，各 once；由 index.mjs 走
  #     systemPrompt.section({name, order, text}) 一次性注册。
  #     🔴 草案 §4 想要 position.after（相对锚点，"跟在某人后面"），校验器不支持 →
  #     这里用裸 order 表达同一位置意图（草案 §3 的锚点对应的宿主常量见注释）。
  # ══════════════════════════════════════════════════════════════════════════

  # characters/deepseek.md · ① 常驻层（角色卡；换角色只换这个文件）
  # 位置意图：draft `after: deployment:persona-prefix`；对应宿主常量 DEPLOYMENT_PERSONA_PREFIX
  #   order=0（侦察_L1_拼装权.md §1.4 段序表）。取 10200 使其落在
  #   DEPLOYMENT_PERSONA_SUFFIX(10200) 之后、不与之撞号（section name 由引擎加前缀，
  #   index.mjs 用 `socratic-engine:${block.id}`）。
  # 🔴 2026-10-19：演示角色换成「鲸（DeepSeek 娘）」。角色卡换文件即可，
  #   教学法（system_core / _anchor）与世界观（world/）另行维护，互不牵连。
  #   旧的 characters/komari.md 保留在树里不删 —— 它是"换角色机制"的对照组。
  - id: persona.deepseek
    path: characters/deepseek.md
    layer: persona
    position: { target: system, order: 10200 }
    frequency: { every: once }
    render: { enabled: false }

  # system_core.md（7596B，126 行）· 草案 §4.1 `teach.system_core` ①′ 启动层
  # 教学法唯一真源（"怎么教"），必须常驻系统段。
  - id: teach.system_core
    path: system_core.md
    layer: context
    position: { target: system, order: 10300 }
    frequency: { every: once }
    render: { enabled: false }

  # world/setting.md（4067B）· 草案 §4.2 `world.setting` ①′ 启动层
  # AGENTS.md 第二步 6："读 world/setting.md ＋ world/metaphor.md——场景与隐喻系统"
  - id: world.setting
    path: world/setting.md
    layer: context
    position: { target: system, order: 10400 }
    frequency: { every: once }
    render: { enabled: false }

  # world/metaphor.md（9640B）· 草案 §4.2 `world.metaphor` ①′ 启动层
  # 🔴 文件自带红线："隐喻只用于建立直觉。正式术语与机制一律以 materials/ch{NN}.md 与
  #    OSTEP 原文为准。"（草案 §4.2 建议在纪律块里复述一行 → 未复述，避免跨块内容重复，
  #    见对账表待确认）
  - id: world.metaphor
    path: world/metaphor.md
    layer: context
    position: { target: system, order: 10500 }
    frequency: { every: once }
    render: { enabled: false }

  # ══════════════════════════════════════════════════════════════════════════
  # B · 纪律层（target: chat, depth 0 = 贴本轮对话之后）—— 本格式最重要的用法
  # ══════════════════════════════════════════════════════════════════════════

  # _anchor.md（3405B）· 草案 §4.1 三拆 → **M2-SCHEMA v0.2 落成四块**（段级切片，P1-1 修复）
  # 🔴 逐块依据（标题名逐字取自 _anchor.md，改标题必须同步改这里，否则引擎报错并列出标题清单）：
  #   ① anchor.rules       「教学取向」              freq=turn（每轮）   chat/depth 0
  #   ② anchor.lesson_ban  「本课不许违反项（每讲更新）」freq=turn（每轮）   chat/depth 0
  #   ③ anchor.voice       「角色声音速查（生成任何台词前看一眼）」freq=once  **system**（① 常驻层）
  #   ④ anchor.check       「教学检查（需要校准时使用）」freq=phase（除 open 相位外）chat/depth 0
  # 依据：文件自述"把最硬的纪律放到**贴近本轮对话**的位置。每轮上课前读一次"（→ ①②每轮）；
  #   ②段自带"（每讲更新）"→ 每轮注入才跟得上换讲；
  #   ③段整门课不变（草案 §4.5 冲突 1：它占了 ② 纪律层体量的一半，且承担"非当课老师轻量人格"）
  #     → 提到 ① 常驻层走系统段；
  #   ④段**不设频率配额**：新版 META_PROMPT v2.3 标准② 明写 `_anchor.md` 是"简短的课中锚点，
  #     不设置问句或自检频率配额"；段名本身就是"**需要校准时使用**"，不是"每 N 轮"（故不再 n_turns=5）。
  #     🔴 但它**也不能是 `on_demand`**（ALIGN-EXEC2 实测）：注入计划器对 `on_demand` 直接
  #     `inject = false`（注释写的是"工具/相位触发路径"，而工具路径尚未实现）
  #     → **标 on_demand ＝ 这个块永久不注入**，不是"按需出现"。
  #     → ALIGN-EXEC3 改 **`every: phase` ＋ `phase: { except: [open] }`**：相位门是**活门**
  #       （逐回合按当前相位裁决），六个相位里除 `open` 外都在场，且**不按回合数计配额**。
  #       为什么排除 `open`（开场）：四问都要以"已经有师生往来"为前提——开场相位还没有可校准的往来。
  #       🔴 为什么不写成不带 `phase:` 的裸 `every: phase`：那种写法 phaseGate 恒真
  #       （`if (!phase) return true`）＝每轮注入、与相位无关，正是本项目禁止的
