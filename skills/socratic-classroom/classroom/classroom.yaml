  # AGENTS.md 第一步 2："读 runtime/progress.md——上到哪了、这节课是第几讲"（每轮课前）；
  #   它是相位判定输入（决定 lesson_no）→ 必须每轮。
  - id: state.progress
    path: runtime/progress.md
    layer: state
    position: { target: chat, depth: 0 }
    frequency: { every: turn }
    wrap: { style: system-reminder }
    render: { enabled: false }

  # runtime/learner_profile.md（1050B）· 草案 §4.4 `state.learner` · n5
  # 草案 §4.5 冲突 2：五层表把它标"① 常驻｜每轮"，但它是**观察累积**型文件
  #   （"每次课后由 AI 依据课堂表现更新"）→ 每轮注入纯属浪费，改 n_turns=5
  #   （与 _anchor.md 的"第 5、10、15… 轮"自检同频）。
  - id: state.learner
    path: runtime/learner_profile.md
    layer: state
    position: { target: chat, depth: 0 }
    frequency: { every: n_turns, n: 5 }
    wrap: { style: system-reminder }
    render: { enabled: false }

  # runtime/mistake_log.md · 草案 §4.4 `state.mistakes` · **phase{check}**（A 改：2026-10-20）
  # 用途：**对答案时要靶子**（整份错题本，含已解决的历史）。它是草案 §3 里 {{last_blocker}} 的来源。
  # 🔴 为什么从 `phases: [open, check]` 收窄成 `[check]`：open 相位的「未解决卡点」已由
  #    `state.mistakes.due`（只切 `## 未解决` 那段）负责；两块都挂 open 会让同一份内容
  #    在一回合里注入两遍（整份 + 段落），既是噪音也违背契约 K3.4「与现有块区分」。
  #    现在分工：**open 只看未解决**，**check 看整份**。
  - id: state.mistakes
    path: runtime/mistake_log.md
    layer: state
    position: { target: chat, depth: 0 }
    frequency: { every: phase }
    phase: { phases: [check] }
    wrap: { style: system-reminder }
    render: { enabled: false }

  # runtime/review_queue.md · 草案 §4.4 `state.review` · **phase{review}**（A 改：2026-10-20）
  # 用途：进入**复习相位**时看整份计划（已到期 + 未来到期点，决定这一轮复习覆盖哪些）。
  # 🔴 为什么从 `phases: [open]` 改成 `[review]`：open 相位只该看到「**今天到期**的那几条」，
  #    那由 `state.review.due`（只切 `## 到期待复习` 那段）负责；两块都挂 open 会重复注入。
  #    现在分工：**open 只看到期项**，**review 看整份计划**。
  - id: state.review
    path: runtime/review_queue.md
    layer: state
    position: { target: chat, depth: 0 }
    frequency: { every: phase }
    phase: { phases: [review] }
    wrap: { style: system-reminder }
    render: { enabled: false }

  # ── A（课堂记录）：下一节课开头「未解决的卡点 + 到期复习项」────────────────────
  # 🔴 数据链路（契约 K3）：课上老师调 `classroom_note` → 追加 `runtime/notes.jsonl`（唯一真源）
  #    → 引擎机械重算三份投影（`mistake_log.md` / `review_queue.md` / `knowledge_points.md` 状态位）。
  #    下面两块按 `section:` 只取投影里的那一段，**不重复注入整份文件**（整份仍由上面的
  #    `state.mistakes` / `state.review` 负责，两块的相位门不同、内容粒度不同）。
  # 🔴 **必须带 `phase:`**：裸 `every: phase` 的门恒真（`if (!phase) return true`），
  #    前面 `anchor.check` 的注释点名过这条红线。这里 `frequency: { every: turn }` 管"每回合都重新裁决"，
  #    `phase: { phases: [open] }` 管"只在开场相位出现"——**下节课开头**就是它的语义。
  # 🔴 去重**不新造表**：走现有的 (sessionId, turn) 幂等门（`lib/dedup.mjs`）＋ 注入计划器的
  #    块级记账；同一回合只注入一次，跨会话重新注入（这正是"下节课开头"要的）。
  # 🔴 段标题 `未解决` / `到期待复习` 由 `lib/notestore.mjs` 机械生成；改名必须同步改这里，
  #    否则引擎装载时**报错并列出该文件实际存在的标题**（不静默失效）。
  #    `acceptance/lib/asserts.mjs` 的 `predictTurnBlocks` 会自动把这两块算进期望注入集合
  #    （它按 manifest 字段独立推导；本块没有引入新的频率语义，故**无需改验收侧**）。
  - id: state.mistakes.due
    path: runtime/mistake_log.md
    section: 未解决
    layer: state
    position: { target: chat, depth: 0 }
    frequency: { every: turn }
    phase: { phases: [open] }
    wrap: { style: system-reminder }
    render: { enabled: false }

  - id: state.review.due
    path: runtime/review_queue.md
    section: 到期待复习
    layer: state
    position: { target: chat, depth: 1 }
    frequency: { every: turn }
    phase: { phases: [open] }
    wrap: { style: system-reminder }
    render: { enabled: false }

  # runtime/session_log.md（509B）· 草案 §4.4 `state.session_log` · on_demand
  # AGENTS.md 第三步："延迟加载（用到时才读）：runtime/session_log.md——回顾历史时"。
  # on_demand = 引擎不主动注入；此处仍声明 position（草案 §3 同款做法："声明'若要注入则贴尾'"）。
  - id: state.session_log
    path: runtime/session_log.md
    layer: state
    position: { target: chat, depth: 0 }
    frequency: { every: on_demand }
    wrap: { style: system-reminder }
    render: { enabled: false }

  # runtime/session_archive.md（112B）· 草案 §4.4 `state.archive` · on_demand
  # AGENTS.md 第三步："runtime/session_archive.md——查更早的历史时"。
  - id: state.archive
    path: runtime/session_archive.md
    layer: state
    position: { target: chat, depth: 0 }
    frequency: { every: on_demand }
    wrap: { style: system-reminder }
    render: { enabled: false }

  # runtime/diary.md（463B）· 草案 §4.4 `state.diary` · on_demand（草案标注相位 close）
  # AGENTS.md 第三步："runtime/diary.md——写日记时"；文件头"每课一条，不超过 120 字"
  #   → 收尾时**写**，不必每轮读。写侧归属见本节开头说明。
  - id: state.diary
    path: runtime/diary.md
    layer: state
    position: { target: chat, depth: 0 }
    frequency: { every: on_demand }
    phase: { phases: [close] }        # 草案 §4.4 的 ph=close：若引擎将来接入按需路径，只允许 close 相位
    wrap: { style: system-reminder }
    render: { enabled: false }

  # runtime/wechat_group.md（703B）· 草案 §4.4 `state.wechat` · on_demand
  # 文件头："群聊不承载知识点。它是关系与状态的载体" → 只在生成群聊消息时需要。
  # （文件内提到渲染模板 templates/wechat-chat.html；该目录不在本教室 33 文件内，属 P2 客户端侧。）
  # （口径说明：33 是 2026-09-23 建教室时的文件数；2026-09-24 教材 1–14 讲落盘后实测为 49 个文件。二者不是同一口径，勿直接比较。）
  - id: state.wechat
    path: runtime/wechat_group.md
    layer: state
    position: { target: chat, depth: 0 }
    frequency: { every: on_demand }
    wrap: { style: system-reminder }
    render: { enabled: false }

  # ══════════════════════════════════════════════════════════════════════════
  # E · N 车道接线（2026-10-21）：下节课开头「她读到自己写的 / 群里最近的消息」
  #
  # 🔴 内容**不在文件里**：`dynamic:` 让引擎在**注入时**现取（lib/narrativebridge.mjs）：
  #    · state.diary.recent  → 叙事服务 `readRecentDiaries({limit:1})` 的最后一条（N2.4）
  #    · state.wechat.recent → runtime/wechat_group.jsonl 的最后 8 条（契约 K4.2 / 开发文档 N3.5）
  #    🔴 叙事服务没装 / 群聊还没有消息 → 注入一行**诚实的占位行**（如"（你还没有写过日记。）"）。
  #      为什么不是"整块不注入"：频率门过了就必须出现——否则验收侧 predictTurnBlocks
  #      （独立推导）会预测它、生产侧却不注入，A2 立刻红；而且"没生效"会静默消失、没人知道。
  #
  # 🔴 **频率必须带 phase:**（裸 `every: phase` 的门恒真，是上面 state.mistakes.due 那段的红线）。
  #    这里：`frequency: {every: once, anchor: lesson_start}` 管「每讲一次」，
  #    `phase: {phases: [open]}` 管「只在开场相位」——合起来＝**下节课开头**。
  #    两个记账都走现有的（injectedLesson / injectedOnce），**不新造去重表**。
  # 🔴 **不加 lesson: 讲次门**：这两块是**跨讲**的（每讲开头都读"最近"的那一条/那几条），
  #    不属于某一讲；挂上讲次门反而会在换讲时整块消失。
  # 🔴 验收侧的第二份频率实现（acceptance/lib/asserts.mjs 的 predictTurnBlocks）按 manifest
  #    字段独立推导这两块——这里**没有引入新的频率语义**，所以那边不用改。
  # ══════════════════════════════════════════════════════════════════════════
  - id: state.diary.recent
    dynamic: { kind: diary }
    layer: state
    position: { target: chat, depth: 0 }
    frequency: { every: once, anchor: lesson_start }
    phase: { phases: [open] }
    wrap: { style: system-reminder }
    render: { enabled: false }

  - id: state.wechat.recent
    dynamic: { kind: wechat, limit: 8 }
    layer: state
    position: { target: chat, depth: 0 }
    frequency: { every: once, anchor: lesson_start }
    phase: { phases: [open] }
    wrap: { style: system-reminder }
    render: { enabled: false }

